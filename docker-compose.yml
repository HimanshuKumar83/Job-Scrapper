version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: jobpulse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobpulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobpulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: jobpulse-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/jobpulse
      PRIMARY_SOURCE: jobicy
      FALLBACK_SOURCE: remoteok
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
